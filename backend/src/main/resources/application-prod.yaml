spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

app:
  cors:
    allowed-origin: ${FRONTEND_URL}