spring:
  application:
    name: meeting-mind-ai

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        project-id: ${PROJECT_ID}
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

app:
  file:
    upload-dir: ${UPLOAD_DIR:uploads/meetings}
    max-size: ${MAX_FILE_SIZE:10485760} # 10MB

    allowed-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
      - text/plain
      - text/markdown
      - text/x-markdown
      - application/rtf
      - text/rtf
      - application/vnd.oasis.opendocument.text
      - text/html

    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt

  ai:
    providers:
      gemini:
        models:
          - gemini-3.1-flash-lite
          - gemini-3.1-flash-lite-preview
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.6-flash
          - gemini-3.1-pro-preview
          - gemini-3-pro-preview

  cors:
    allowed-origin: ${FRONTEND_URL}